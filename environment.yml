# Environment of bachue (tested on macOS arm64 with Python 3.12; the versions of the comments are those of hag_env on
# 2026-11-22, except jax, pytorch and tensorflow: those of bachue_env). hag and reservoirpy are installed afterwards in
# editable mode, without their dependencies: hag pins reservoirpy to a commit of the main repository, while bachue
# needs the branch ridge-solvers of the fork (Ridge with solvers, reservoirpy PR #261), and pip refuses two sources for
# the same package in one installation.
#   micromamba create -f environment.yml
#   micromamba activate bachue_env
#   git clone -b main git@github.com:Finebouche/hag.git ../hag
#   git clone -b ridge-solvers git@github.com:Finebouche/reservoirpy.git ../reservoirpy
#   pip install --no-deps -e ../hag -e ../reservoirpy -e .
# Then, from the root of bachue: python -m pytest tests (or PYTHONPATH=$PWD python -m bachue...).
name: bachue_env
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy            # 2.3.5
  - scipy            # 1.17.1
  - pandas           # 2.3.3
  - scikit-learn     # 1.8.0
  - joblib           # 1.5.3
  - optuna           # 4.9.0
  - sqlalchemy       # 2.0.51 (the databases of the studies)
  - matplotlib       # 3.11.0
  - seaborn          # 0.13.2 (hag)
  - aeon             # 1.5.0 (bachue.datasets: the aeon datasets, JapaneseVowels)
  - librosa          # 0.11.0 (the MFCC of the songs)
  - pysoundfile      # 0.14.0 (soundfile on PyPI)
  - numba            # 0.63.1 (librosa)
  - networkx         # hag
  - imageio          # hag
  - tqdm             # 4.68.4
  - pytest           # 9.1.1
  - jax              # 0.10.2 (the JAX nodes of hag, the online readout rules)
  - jaxlib
  - pytorch          # 2.12.0 (from conda-forge, not pip: the torch of PyPI brings its own libomp, which clashes
                     # with the llvm-openmp of conda-forge, "OMP: Error #15" at the first import)
  - torchaudio       # 2.11.0 (bachue.datasets: SPEECHCOMMANDS)
  - tensorflow       # 2.21.0 (bachue.datasets: reading the WAV files of some datasets; hag)
  - cmaes            # hag
  - dcor             # hag
  - svgpath2mpl      # hag
  - pip
