<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const MIN_TRIALS = DATA.n_trials / 10;  // (a study with fewer trials is not shown)
// (model "none": a study of a kernel of the inputs, without reservoir, size (its size: its window of frames) nor leak)
const CV_STUDIES = DATA.studies.map(([dataset, leak, rule, selection, model, size, best, done]) => ({dataset, leak, rule, selection, model, size, best, done, kernel: model === 'none'})).filter(s => s.done >= MIN_TRIALS);
// the final evaluations of the studies (choice "test"): the mean test accuracy over the seeds; "done" counts the
// seeds, complete at N_SEEDS (a kernel, deterministic: a single evaluation, complete)
const N_SEEDS = 10;
const TESTS = (DATA.tests || []).map(([dataset, leak, rule, selection, model, size, best, seeds, sd]) => ({dataset, leak, rule, selection, model, size, best, done: model === 'none' ? N_SEEDS : seeds, sd, kernel: model === 'none'}));
const isTest = () => element('score').value === 'test';
let STUDIES = CV_STUDIES;
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
const grid = dark ? '#2c2c2a' : '#e1e0d9', ink = '#898781';
// color and point style (Chart.js) of each rule, and the same shapes in the legend (SVG, 12 x 12)
const STYLES = {ridge: ['#2a78d6', 'circle'], nlms: ['#eb6834', 'rectRot'], eh_np_local: ['#1baf7a', 'triangle']};
const OTHER_STYLES = [['#eda100', 'rect'], ['#e87ba4', 'star'], ['#6250d6', 'crossRot']];
const SHAPES = {circle: '<circle cx="6" cy="6" r="5"/>', rectRot: '<polygon points="6,0.5 11.5,6 6,11.5 0.5,6"/>',
  triangle: '<polygon points="6,1 11.5,11 0.5,11"/>', rect: '<rect x="1.5" y="1.5" width="9" height="9"/>',
  star: '<path d="M6 0.5V11.5M0.5 6H11.5M2 2L10 10M10 2L2 10" fill="none" stroke-width="1.5"/>',
  crossRot: '<path d="M1.5 1.5L10.5 10.5M10.5 1.5L1.5 10.5" fill="none" stroke-width="1.8"/>'};
const icon = (color, shape) => `<svg width="12" height="12" viewBox="0 0 12 12" fill="${color}" stroke="${color}" aria-hidden="true">${SHAPES[shape]}</svg>`;
const NAMES = ['Sans fuite', 'Avec fuite', 'Meilleure des deux fuites'];
const fr = (x, digits = 1) => x.toFixed(digits).replace('.', ',');
const unique = values => [...new Set(values)];
const element = id => document.getElementById(id);
// the references first: the states alone ("linear"), the kernels without reservoir, then all the monomials of an
// order ("order2", trained in dual form)
const KERNELS = {volterra: 'noyau de Volterra'};
const rank = selection => selection === 'linear' ? 0 : KERNELS[selection] ? 0.5 : /^order\d+$/.test(selection) ? 1 : 2;
const shown = selection => rank(selection) === 0 ? 'ordre 1, états seuls' : KERNELS[selection] || (rank(selection) === 1 ? `ordre ${selection.slice(5)} complet, dual` : selection);
function added(selection, outputs) {  // (the inputs added to the N states)
  const [kind, size] = selection.split(':');
  if (rank(selection) === 0 || ['half_squares', 'neighbors_t2', 'neighbors_t3'].includes(kind)) return '+0';
  if (rank(selection) === 1) return '+N(N+1)/2';
  if (kind === 'squares') return '+N';
  if (kind === 'scores') return '+' + outputs * (outputs + 1) / 2;
  if (!+size) return '';
  const count = ['weights_high', 'weights_low', 'random', 'pca', 'pca_frames'].includes(kind) ? size * (+size + 1) / 2 : +size;
  return (kind === 'nystrom' ? '≤ +' : '+') + count.toLocaleString('fr-FR');
}
function fill(id, values, labels) {
  const select = element(id), current = select.value;
  select.innerHTML = values.map((value, i) => `<option value="${value}">${labels ? labels[i] : value}</option>`).join('');
  if (values.map(String).includes(current)) select.value = current;
}
function styleOf(rule, rules) {
  return STYLES[rule] || OTHER_STYLES[rules.filter(r => !STYLES[r]).indexOf(rule) % OTHER_STYLES.length];
}
// value of a point: the mean over the models, or the best of them (highest), its range (the binomial standard error
// on the rows of the cross-validation; for a mean, the extreme models) and whether a study is incomplete or absent
function value(studies, rule, selection, leak, models, rows, highest) {
  const found = models.map(model => studies.find(s => s.rule === rule && s.selection === selection && s.leak === leak && s.model === model));

const RADIUS = 6, DEPTH = {crossRot: 0, star: 1, triangle: 2, rectRot: 3, rect: 4, circle: 5};  // (the smallest shapes on top)

  triangle: (c, r) => { c.moveTo(0, -r); c.lineTo(0.87 * r, 0.5 * r); c.lineTo(-0.87 * r, 0.5 * r); c.closePath(); },
  rect: (c, r) => c.rect(-0.71 * r, -0.71 * r, 1.42 * r, 1.42 * r),

  crossRot: (c, r) => { c.moveTo(-0.71 * r, -0.71 * r); c.lineTo(0.71 * r, 0.71 * r); c.moveTo(0.71 * r, -0.71 * r); c.lineTo(-0.71 * r, 0.71 * r); }};

// (the order of the reservoirs in their list, then the mean and the best of them)
const MODEL_ORDER = ['random_ei', 'random_ee', 'mean_hag', 'var_hag'];
const order = model => MODEL_ORDER.includes(model) ? MODEL_ORDER.indexOf(model) : MODEL_ORDER.length;
// the lines followed (a click on a line adds or removes it, kept when the settings change): the other lines paler
const FOCUS = new Set();
const panel = getComputedStyle(document.documentElement).getPropertyValue('--panel').trim() || '#f1efe8';
const focusPlugin = {id: 'focus', afterDatasetsDraw(chart) {

let chart = null;
const DATASET_INFO = {  // (the dataset shown: one short line; the split as "train → test")
  marron1: ['marron1', ['1 canari', '459 chants', '13 MFCC', 'phrase suivante, 29 classes', '367 → 92 chants']],
  japanese_vowels: ['JapaneseVowels', ['9 locuteurs, /ae/', '12 LPC, 7 à 29 trames', '9 classes', '270 → 370 énoncés']],
  insect_sound: ['InsectSound', ['ailes de moustiques et de mouches', '600 pas, en MFCC', '10 classes', '25 000 → 25 000']],

function showDatasetInfo(dataset) {
  const [name, facts] = DATASET_INFO[dataset] || [dataset, []];
  element('dataset-info').innerHTML = `<b>${name}</b>` + facts.map(f => `<span${f.includes('→') ? ' title="entraînement → test"' : ''}>${f}</span>`).join('');
}
function draw() {
  if (chart) chart.destroy();
  const test = isTest();
  STUDIES = test ? TESTS : CV_STUDIES;
  fill('dataset', unique(STUDIES.map(s => s.dataset)).sort((a, b) => (a === 'marron1' ? -1 : b === 'marron1' ? 1 : a.localeCompare(b))));
  const dataset = element('dataset').value;
  showDatasetInfo(dataset);
  // (the rows of the binomial standard error: those of the cross-validation, or the test instances)
  const ofDataset = STUDIES.filter(s => s.dataset === dataset), outputs = DATA.outputs[dataset];
  const rows = test ? (DATA.test_rows || {})[dataset] || DATA.rows[dataset] : DATA.rows[dataset];
  element('what').textContent = test ? 'Exactitude de test de chaque étude : la moyenne de son évaluation finale sur 10 graines, avec les réservoirs et les hyperparamètres de son étude.' : 'Meilleure exactitude de validation croisée de chaque étude HPO : un maximum sur ses essais, pas un score de test.';
  fill('size', unique(ofDataset.filter(s => !s.kernel).map(s => s.size)).sort((a, b) => a - b));
  const size = +element('size').value, ofReservoirs = ofDataset.filter(s => !s.kernel && s.size === size);
  const allModels = unique(ofReservoirs.map(s => s.model)).sort((a, b) => order(a) - order(b) || a.localeCompare(b));
  // (a kernel study, without reservoir nor leak: the same point for every reservoir and leak)

  fill('model', [...allModels, '*', '^'], [...allModels, `moyenne des ${allModels.length}`, `meilleur des ${allModels.length}`]);
  if (!element('model').dataset.chosen) element('model').value = '^';  // (by default: the best of the reservoirs)
  const model = element('model').value, highest = model === '^', models = model === '*' || highest ? allModels : [model];
  // (leaks drawn: one, both, or 2: for each point the better of the two)
  const leak = element('leak').value, both = leak === '2', leaks = both ? [0, 1] : leak === '3' ? [2] : [+leak];
  const rules = unique(studies.map(s => s.rule)).sort((a, b) => (STYLES[a] ? 0 : 1) - (STYLES[b] ? 0 : 1) || Object.keys(STYLES).indexOf(a) - Object.keys(STYLES).indexOf(b));
  const mean = selection => { const v = studies.filter(s => s.selection === selection && s.rule === rules[0] && s.best !== null).map(s => s.best); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0; };
  const selections = unique(studies.map(s => s.selection)).sort((a, b) => rank(a) - rank(b) || mean(b) - mean(a));
  const ofLeak = leak => rules.map(rule => selections.map(selection => value(studies, rule, selection, leak, models, rows, highest)));
  const better = (a, b) => !a || !b ? (a || b) && {...(a || b), partial: true, chosen: true} : {...(a.y >= b.y ? a : b), partial: a.partial || b.partial, chosen: true};

  const all = studies.filter(s => s.best !== null).map(s => s.best);  // (the same axis for all the reservoirs and leaks of a dataset)
  const range = all.length ? [Math.floor(Math.min(...all) - 0.3), Math.ceil(Math.max(...all) + 0.3)] : [0, 100];
  const labels = selections.map((selection, i) => shown(selection) + (values.some(byRule => byRule.some(v => v[i] && v[i].partial)) ? ' *' : ''));
  const hatched = `<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><defs><pattern id="hatch" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="3" fill="#fff"/><rect width="1.4" height="3" fill="${ink}"/></pattern></defs><circle cx="6" cy="6" r="5" fill="url(#hatch)" stroke="${ink}"/></svg>`;

  element('chart').setAttribute('aria-label', `${dataset}, ${leakName} : exactitude par sélection et par règle`);
  const datasets = leaks.flatMap((leak, l) => rules.map((rule, r) => {
    const [color, shape] = styleOf(rule, rules), isHatched = both && leak === 0, pattern = hatch(color);

      plugins: {legend: {display: false}, tooltip: {callbacks: {title: items => { const selection = selections[items[0].dataIndex]; return KERNELS[selection] ? `${shown(selection)} : tous les monômes des MFCC à tous les retards` : `${shown(selection)} (${added(selection, outputs)} entrées)`; }, label: c => c.raw === null ? '' : `${c.dataset.label} : ${fr(c.raw)} %${c.dataset.models[c.dataIndex] ? ', ' + c.dataset.models[c.dataIndex] : ''}${c.dataset.leaks[c.dataIndex] === null ? '' : ', ' + NAMES[c.dataset.leaks[c.dataIndex]].toLowerCase()}, de ${fr(c.dataset.ranges[c.dataIndex][0])} à ${fr(c.dataset.ranges[c.dataIndex][1])} (${c.dataset.done[c.dataIndex].join(', ')} ${isTest() ? 'graines, ' + N_SEEDS : 'essais, ' + DATA.n_trials} demandés)`}}},
